services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: convention_tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Pass .env straight through instead of re-declaring each key as
    # `KEY: ${KEY}`.
    #
    # With the enumerated form, a key missing from .env does NOT fall back to
    # anything - `${KEY}` interpolates to an empty string and the container
    # receives KEY="". That is indistinguishable from "deliberately blank", and
    # it silently clobbers the value even when something else would have
    # supplied it. EMAIL_FROM arrived empty in production exactly this way.
    #
    # env_file has no such failure mode: a key present in .env reaches the
    # container, a key absent from .env is simply not set, and the app can tell
    # the difference.
    #
    # Deliberately the plain string form, not `- path: .env / required: false`.
    # The object form needs Docker Compose 2.24+ (Jan 2024); on anything older
    # the service fails to start while services without an env_file come up
    # fine, which looks like the backend crashing rather than a schema problem.
    # The string form works everywhere, but the file must EXIST - `cp
    # .env.example .env` before `docker compose up` locally. Beachhead always
    # writes one.
    env_file:
      - .env
    environment:
      # Only values that are genuinely computed here, or constant.
      NODE_ENV: production
      PORT: 3000
      JWT_EXPIRES_IN: 2y
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/convention_tickets
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    command: sh -c "npm run migrate && npm run seed && node src/migrations/seed-superadmin.js && node src/migrations/seed-verifier.js && npm start"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOPIFY_API_KEY: ${SHOPIFY_APP_CLIENT_ID}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

  verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
    name: event-ticket-manager-postgres
  backend_uploads:
    name: event-ticket-manager-uploads

networks:
  internal:
